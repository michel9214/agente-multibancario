name: agente_multibanco
description: App de cuadre de caja para agentes multibancarios
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.3.0
  dio: ^5.7.0
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  permission_handler: ^11.3.1
  flutter_image_compress: ^2.3.0
  intl: ^0.19.0
  fl_chart: ^0.69.0
  share_plus: ^10.0.3
  path_provider: ^2.1.4
  drift: ^2.20.3
  sqlite3_flutter_libs: ^0.5.24
  connectivity_plus: ^6.0.5
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10+1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
